name: build-windows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Put this branch on top of the newest upstream
        shell: bash
        run: |
          git config user.name "kettu-build"
          git config user.email "kettu-build@users.noreply.github.com"
          git remote add upstream https://github.com/KettuAI/Kettu.git
          git fetch upstream --tags
          CHANGED=0
          if [ "$(git rev-list --count HEAD..upstream/main)" -gt 0 ]; then CHANGED=1; fi
          git rebase upstream/main
          git push --force-with-lease origin HEAD:main
          echo "CHANGED=$CHANGED" >> "$GITHUB_ENV"

      - name: Stop when nothing new and not run by hand
        if: env.CHANGED == '0' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          echo "Upstream has no new commits; nothing to build."
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Bump the patch version
        if: env.SKIP != '1'
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const v=p.version.split('.').map(Number);v[2]+=1;p.version=v.join('.');fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('version',p.version)"
          git commit -am "release: bump version" || true
          git push origin HEAD:main || true
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install
        if: env.SKIP != '1'
        run: pnpm install --frozen-lockfile

      - name: Device helpers
        if: env.SKIP != '1'
        run: node tools/install/device-helpers.mjs
        continue-on-error: true

      - name: Computer-use driver
        if: env.SKIP != '1'
        run: node tools/install/cua-driver.mjs
        continue-on-error: true

      - name: Build
        if: env.SKIP != '1'
        run: pnpm build

      - name: Package the Windows installer
        if: env.SKIP != '1'
        run: pnpm exec electron-builder --win --config electron-builder.yml --publish never

      - name: Publish the release
        if: env.SKIP != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kettu ${{ env.VERSION }} (local build)
          body: |
            Built from this fork: newest KettuAI/Kettu main with the local changes
            (DeepSeek routing group via Magpie, balance in the usage page and composer).
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
